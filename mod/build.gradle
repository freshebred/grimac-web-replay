plugins { id 'net.fabricmc.fabric-loom' version '1.19-SNAPSHOT' }
version = '0.1.0'
group = 'xyz.grimreplay'
base { archivesName = 'grim-replay-bridge' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:26.3'
 implementation 'net.fabricmc:fabric-loader:0.20.1'
 implementation 'net.fabricmc.fabric-api:fabric-api:0.165.2+26.3'
 testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
test { useJUnitPlatform() }
